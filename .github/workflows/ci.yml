name: CI/CD Pipeline
permissions:
  contents: read

on:
  push:
    branches: [blog]
  pull_request:
    branches: [blog]

env:
  NODE_VERSION: '22'
  YARN_VERSION: '1.22'

jobs:
  # Build
  build-and-test:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Build application
        run: yarn build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

  # Deploy to Production (blog branch only)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/blog'
    
    env:
      CONTAINER_NAME: nest-app
      CONTAINER_PORT: 3000
      HOST_PORT: 3000
      DOCKER_NETWORK: manga_sbs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Encode environment file to base64
        id: encode_env
        env:
          ENV_CONTENT: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          # Write secret directly to file using printf to avoid shell interpretation issues
          # This handles multi-line content, special characters, and newlines safely
          # Use %b to interpret escape sequences, or %s to preserve exactly as-is
          printf '%s' "$ENV_CONTENT" > /tmp/env_raw.txt
          # Encode to base64 (remove newlines for single-line output)
          # Try GNU base64 first (with -w 0), fallback to standard base64 + tr
          base64 -w 0 /tmp/env_raw.txt > /tmp/env_base64.txt 2>/dev/null || base64 /tmp/env_raw.txt | tr -d '\n' > /tmp/env_base64.txt
          ENV_B64=$(cat /tmp/env_base64.txt)
          echo "ENV_B64=${ENV_B64}" >> $GITHUB_OUTPUT
          # Clean up temporary file
          rm -f /tmp/env_raw.txt
      
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          script: |
            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            
            # Determine image tag (use branch name)
            IMAGE_TAG="blog"
            IMAGE_NAME="ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ github.event.repository.name }}:${IMAGE_TAG}"
            
            # Pull image with branch tag
            docker pull "${IMAGE_NAME}"
            
            # Stop old container (ignore errors if not exists)
            docker stop "${{ env.CONTAINER_NAME }}" 2>/dev/null || true
            
            # Remove old container (ignore errors if not exists)
            docker rm "${{ env.CONTAINER_NAME }}" 2>/dev/null || true
            
            # Create Docker network if it doesn't exist (bridge driver)
            if ! docker network inspect "${{ env.DOCKER_NETWORK }}" >/dev/null 2>&1; then
              docker network create --driver bridge "${{ env.DOCKER_NETWORK }}"
            fi
            
            # Create .env file from base64 encoded content (safe method)
            # This avoids bash syntax errors with special characters in secret
            ENV_FILE="/tmp/${{ env.CONTAINER_NAME }}.env"
            # Decode base64 content to preserve exact format (critical for PEM keys and multi-line values)
            echo "${{ steps.encode_env.outputs.ENV_B64 }}" | base64 -d > "${ENV_FILE}"
            
            # Verify .env file was created and has content
            if [ ! -f "${ENV_FILE}" ]; then
              echo "Error: .env file was not created"
              exit 1
            fi
            
            # Check file size (should be > 0)
            FILE_SIZE=$(stat -f%z "${ENV_FILE}" 2>/dev/null || stat -c%s "${ENV_FILE}" 2>/dev/null || wc -c < "${ENV_FILE}" || echo "0")
            if [ "$FILE_SIZE" -eq 0 ] || [ -z "$FILE_SIZE" ]; then
              echo "Error: .env file appears to be empty (size check: ${FILE_SIZE})"
              echo "File content preview (first 100 chars):"
              head -c 100 "${ENV_FILE}" || echo "(cannot read file)"
              exit 1
            fi
            
            # Show first few lines of .env file for debugging (without values)
            echo "Env file created successfully (size: ${FILE_SIZE} bytes). First few variable names:"
            head -5 "${ENV_FILE}" | cut -d'=' -f1 | sed 's/^/  - /' || true
            echo "Total lines in .env file: $(wc -l < "${ENV_FILE}" || echo "0")"
            
            # Run new container with environment file (like GitLab CI env_file)
            # Join Docker network: manga_sbs (bridge driver)
            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              --network "${{ env.DOCKER_NETWORK }}" \
              -p "${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }}" \
              --env-file "${ENV_FILE}" \
              "${IMAGE_NAME}"
            
            # Wait a moment for container to start
            sleep 2
            
            # Clean up .env file after container starts (optional, for security)
            rm -f "${ENV_FILE}"
            
            # Verify container is running
            docker ps | grep "${{ env.CONTAINER_NAME }}" || echo "Warning: Container may not be running"