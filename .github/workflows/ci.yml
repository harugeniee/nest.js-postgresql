name: CI/CD Pipeline
permissions:
  contents: read

on:
  push:
    branches: [blog]
  pull_request:
    branches: [blog]

env:
  NODE_VERSION: '22'
  YARN_VERSION: '1.22'

jobs:
  # Build
  build-and-test:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Build application
        run: yarn build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

  # Deploy to Production (blog branch only)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/blog'
    
    env:
      CONTAINER_NAME: nest-app
      CONTAINER_PORT: 3000
      HOST_PORT: 3000
      DOCKER_NETWORK: manga_sbs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: 'true'
      
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          script: |
            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            
            # Determine image tag (use branch name)
            IMAGE_TAG="blog"
            IMAGE_NAME="ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ github.event.repository.name }}:${IMAGE_TAG}"
            
            # Pull image with branch tag
            docker pull "${IMAGE_NAME}"
            
            # Stop old container (ignore errors if not exists)
            docker stop "${{ env.CONTAINER_NAME }}" 2>/dev/null || true
            
            # Remove old container (ignore errors if not exists)
            docker rm "${{ env.CONTAINER_NAME }}" 2>/dev/null || true
            
            # Prepare deployment directory
            DEPLOY_DIR="$HOME/nest.js-postgresql"
            echo "Preparing deployment directory: ${DEPLOY_DIR}"
            
            # Create directory if it doesn't exist
            mkdir -p "${DEPLOY_DIR}"
            
            # Create Docker network if it doesn't exist (bridge driver)
            if ! docker network inspect "${{ env.DOCKER_NETWORK }}" >/dev/null 2>&1; then
              docker network create --driver bridge "${{ env.DOCKER_NETWORK }}"
            fi
            
            # Start containers
            echo "Starting containers..."
            cd "${DEPLOY_DIR}"
            # Export IMAGE_NAME so docker-compose can use it
            export IMAGE_NAME="${IMAGE_NAME}"
            # Use pulled image instead of building (image already pulled above)
            # Remove --build flag to use existing image
            docker compose up -d
            
            echo "Deployment complete!"
            echo "Containers running: $(docker ps | grep '${{ env.CONTAINER_NAME }}' || echo 'none')"