name: CI/CD Pipeline
permissions:
  contents: read

on:
  push:
    branches: [blog]
  pull_request:
    branches: [blog]

env:
  NODE_VERSION: '22'
  YARN_VERSION: '1.22'

jobs:
  # Build
  build-and-test:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Build application
        run: yarn build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

  # Deploy to Production (main branch only)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    env:
      CONTAINER_NAME: nest-app
      CONTAINER_PORT: 3000
      HOST_PORT: 3000
      DOCKER_NETWORK: manga_sbs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          script: |
            # Login to GitHub Container Registry
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            
            # Pull latest image
            docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ github.event.repository.name }}:latest
            
            # Stop old container (ignore errors if not exists)
            docker stop ${{ env.CONTAINER_NAME }} || true
            
            # Remove old container (ignore errors if not exists)
            docker rm ${{ env.CONTAINER_NAME }} || true
            
            # Create Docker network if it doesn't exist (bridge driver)
            docker network inspect ${{ env.DOCKER_NETWORK }} >/dev/null 2>&1 || \
              docker network create --driver bridge ${{ env.DOCKER_NETWORK }}
            
            # Create .env file from single GitHub Secret (similar to GitLab CI env_file)
            # Single secret PRODUCTION_ENV_FILE contains entire .env file content
            ENV_FILE="/tmp/${{ env.CONTAINER_NAME }}.env"
            echo "${{ secrets.PRODUCTION_ENV_FILE }}" > "$ENV_FILE"
            
            # Run new container with environment file (like GitLab CI env_file)
            # Join Docker network: manga_sbs (bridge driver)
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network ${{ env.DOCKER_NETWORK }} \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              --env-file "$ENV_FILE" \
              ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ github.event.repository.name }}:latest
            
            # Clean up .env file after container starts (optional, for security)
            rm -f "$ENV_FILE"