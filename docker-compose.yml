services:
  # NestJS Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ${CONTAINER_NAME:-nest-app}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Mount .env file so NestJS can read it (ConfigModule uses envFilePath: '.env')
      - ./.env:/app/.env:ro
    networks:
      - manga_sbs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  # Use external network created by service/docker-compose.yml
  # Make sure to run 'docker-compose -f service/docker-compose.yml up -d' first
  manga_sbs:
    external: true
    name: manga_sbs 