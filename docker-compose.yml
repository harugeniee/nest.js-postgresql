services:
  # NestJS Application Service
  app:
    # Image from GitHub Container Registry (ghcr.io)
    # Format: ghcr.io/username/repo-name:tag
    # IMAGE_NAME is set in CI deployment script as environment variable before running docker compose
    # If IMAGE_NAME is not set, docker-compose will build from Dockerfile instead
    # Default fallback ensures local development still works
    image: ${IMAGE_NAME:-nest-app:latest}
    container_name: ${CONTAINER_NAME:-nest-app}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Mount .env file so NestJS can read it (ConfigModule uses envFilePath: '.env')
      - ./.env:/app/.env:ro
    networks:
      - manga_sbs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v5', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  # Use external network created by service/docker-compose.yml
  # Make sure to run 'docker-compose -f service/docker-compose.yml up -d' first
  manga_sbs:
    external: true
    name: manga_sbs 